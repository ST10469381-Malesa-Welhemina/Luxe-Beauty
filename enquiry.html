<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Beauty - Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header section with logo and navigation menu -->
    <header>
        <div class="logo">
            <a href="index.html">
            <img src="images/logo.jpeg" alt="Luxe Beauty Logo" width="60">
            <h1>Luxe Beauty</h1></a>
        </div>
        <nav>
            <a href="index.html" target="_blank">Home</a> &nbsp;|&nbsp;
            <a href="about.html" target="_blank">About</a> &nbsp;|&nbsp;
            <a href="products.html" target="_blank">Products</a> &nbsp;|&nbsp;
            <a href="enquiry.html" target="_blank">Enquiry</a> &nbsp;|&nbsp;
            <a href="contact.html" target="_blank">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Need Beauty Advice?</h1>
        <p>Complete the enquiry form and one of our beauty consultants will contact you.</p>

        <!-- Enquiry form -->
        <form action="#" method="post">

            <!-- Dropdown -->
            <label for="interest">What are you looking for?</label>
            <select id="interest" name="interest">
                <option value="makeup">Makeup</option>
                <option value="skincare">Skincare</option>
                <option value="fragrance">Fragrance</option>
                <option value="accessories">Beauty Accessories</option>
            </select>

            <!-- Radio buttons -->
            <fieldset>
                <legend>Preferred Shopping Method</legend>
                <label>
                    <input type="radio" name="shopping_method" value="online"> Online
                </label>
                <label>
                    <input type="radio" name="shopping_method" value="in-store"> In Store
                </label>
            </fieldset>

            <!-- Number input -->
            <label for="quantity">How many products are you interested in?</label>
            <input type="number" id="quantity" name="quantity" min="1" max="20">

            <!-- Date picker -->
            <label for="consultation-date">Preferred Consultation Date</label>
            <input type="date" id="consultation-date" name="consultation-date">

            <!-- Textarea -->
            <label for="message">Tell us how we can help you.</label>
            <textarea id="message" name="message" rows="5" cols="40" placeholder="Your enquiry details..."></textarea>

            <!-- Submit button -->
            <input type="submit" value="Submit Enquiry">

        </form>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-social">
            <h3>Follow Us</h3>
            <ul>
                <li><a href="https://www.facebook.com/skinrepublicsa" target="_blank">Facebook</a></li>
                <li><a href="https://www.instagram.com/skinrepublicsa" target="_blank">Instagram</a></li>
                <li><a href="https://www.tiktok.com/@skinrepublicsa" target="_blank">TikTok</a></li>
                <li><a href="https://www.youtube.com/@SkinRepublicSA" target="_blank">YouTube</a></li>
            </ul>
        </div>
        <div class="footer-copy">
            <p>&copy; 2026 Luxe Beauty. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
